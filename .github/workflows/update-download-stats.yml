name: Update model download statistics

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exomind-download-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh download statistics
        run: python tools/update_download_stats.py

      - name: Commit changed statistics
        run: |
          if git diff --quiet -- docs/download-stats.json; then
            echo "Download statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/download-stats.json
          git commit -m "docs: refresh model download statistics"
          git push
